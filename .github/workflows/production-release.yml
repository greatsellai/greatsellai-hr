name: Production promotion

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PROMOTE to release the current completed staging candidate to production.
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  verify-staging:
    name: Verify completed staging candidate
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "Linux", "X64", "greatsell-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment:
      name: staging
    outputs:
      staging_tag: ${{ steps.verified.outputs.staging_tag }}
      release_sha: ${{ steps.verified.outputs.release_sha }}
      archive_sha256: ${{ steps.verified.outputs.archive_sha256 }}
      ci_image_archive_sha256: ${{ steps.verified.outputs.ci_image_archive_sha256 }}
      api_image_config_digest: ${{ steps.verified.outputs.api_image_config_digest }}
      caddy_image_config_digest: ${{ steps.verified.outputs.caddy_image_config_digest }}
      ci_run_id: ${{ steps.verified.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.verified.outputs.ci_run_attempt }}
    steps:
      - name: Validate promotion request
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Production promotion must be started from main." >&2; exit 1; }
          [[ "$CONFIRM" == "PROMOTE" ]] || { echo "Confirmation must be PROMOTE." >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Resolve the current completed staging tag
        id: target
        run: |
          set -Eeuo pipefail
          git fetch origin main --tags --prune
          git switch --force-create main origin/main
          release_sha="$(git rev-parse HEAD)"
          mapfile -t staging_tags < <(git tag --points-at "$release_sha" --list 'stg-*' | sort)
          [[ "${#staging_tags[@]}" -eq 1 ]] || {
            echo "Expected exactly one staging tag for current main; stage current main before promoting it." >&2
            exit 1
          }
          staging_tag="${staging_tags[0]}"
          [[ "$staging_tag" =~ ^stg-[0-9]{8}-[0-9a-f]{7,40}$ ]] || { echo "Invalid staging tag." >&2; exit 1; }
          [[ "$release_sha" == "${staging_tag##*-}"* ]] || { echo "Staging tag suffix does not match current main." >&2; exit 1; }
          archive_sha256="$(git archive --format=tar "$staging_tag" | sha256sum | awk '{print $1}')"
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "Unable to checksum staged source." >&2; exit 1; }
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "staging_tag=$staging_tag" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
      - name: Configure staging SSH
        env:
          STAGING_DEPLOY_HOST: ${{ vars.STAGING_DEPLOY_HOST }}
          STAGING_HISTORY_DIR: ${{ vars.STAGING_HISTORY_DIR }}
          STAGING_PROJECT_DIR: ${{ vars.STAGING_PROJECT_DIR }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          : "${STAGING_DEPLOY_HOST:?Missing staging variable STAGING_DEPLOY_HOST}"
          : "${STAGING_PROJECT_DIR:?Missing staging variable STAGING_PROJECT_DIR}"
          : "${STAGING_HISTORY_DIR:?Missing staging variable STAGING_HISTORY_DIR}"
          : "${STAGING_SSH_PRIVATE_KEY:?Missing staging secret STAGING_SSH_PRIVATE_KEY}"
          : "${STAGING_SSH_KNOWN_HOSTS:?Missing staging secret STAGING_SSH_KNOWN_HOSTS}"
          [[ "$STAGING_PROJECT_DIR" == /home/ubuntu/* && "$STAGING_PROJECT_DIR" == *staging* && "$STAGING_PROJECT_DIR" != /home/ubuntu/ ]] || exit 1
          [[ "$STAGING_HISTORY_DIR" == /home/ubuntu/* && "$STAGING_HISTORY_DIR" == *staging* && "$STAGING_HISTORY_DIR" != /home/ubuntu/ ]] || exit 1
          [[ "$STAGING_PROJECT_DIR" != "$STAGING_HISTORY_DIR" ]] || exit 1
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/greatsell-staging-promote"
          chmod 600 "$RUNNER_TEMP/greatsell-staging-promote"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F "${STAGING_DEPLOY_HOST#*@}" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Verify staging attestation and runtime image identities
        id: verified
        env:
          STAGING_DEPLOY_HOST: ${{ vars.STAGING_DEPLOY_HOST }}
          STAGING_HISTORY_DIR: ${{ vars.STAGING_HISTORY_DIR }}
          STAGING_PROJECT_DIR: ${{ vars.STAGING_PROJECT_DIR }}
          STAGING_TAG: ${{ steps.target.outputs.staging_tag }}
          RELEASE_SHA: ${{ steps.target.outputs.release_sha }}
          ARCHIVE_SHA256: ${{ steps.target.outputs.archive_sha256 }}
        run: |
          set -Eeuo pipefail
          scripts/verify-staging-release.sh "$STAGING_TAG" "$RELEASE_SHA" "$ARCHIVE_SHA256" \
            --host "$STAGING_DEPLOY_HOST" \
            --project-dir "$STAGING_PROJECT_DIR" \
            --history-dir "$STAGING_HISTORY_DIR" \
            --ssh-key "$RUNNER_TEMP/greatsell-staging-promote" \
            --github-output "$GITHUB_OUTPUT"

  promote:
    name: Promote the completed staging image to production
    needs: verify-staging
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "Linux", "X64", "greatsell-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    # Do not acquire the deployment lock while this job is waiting for an
    # Environment reviewer; staging must remain available for newer main.
    concurrency:
      group: greatsellai-hr-release-lane
      cancel-in-progress: false
    environment:
      name: production
    env:
      RELEASE_SHA: ${{ needs.verify-staging.outputs.release_sha }}
      STAGING_TAG: ${{ needs.verify-staging.outputs.staging_tag }}
      STAGING_CI_IMAGE_ARCHIVE_SHA256: ${{ needs.verify-staging.outputs.ci_image_archive_sha256 }}
      STAGING_API_IMAGE_CONFIG_DIGEST: ${{ needs.verify-staging.outputs.api_image_config_digest }}
      STAGING_CADDY_IMAGE_CONFIG_DIGEST: ${{ needs.verify-staging.outputs.caddy_image_config_digest }}
      CI_RUN_ID: ${{ needs.verify-staging.outputs.ci_run_id }}
      CI_RUN_ATTEMPT: ${{ needs.verify-staging.outputs.ci_run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ env.RELEASE_SHA }}
      - name: Reconfirm promotion target is still current main
        run: |
          set -Eeuo pipefail
          git fetch origin main --tags --prune
          git switch --force-create main origin/main
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || {
            echo "main advanced after staging verification. Stage the new main before promoting it." >&2
            exit 1
          }
      - name: Configure production SSH
        id: production_ssh
        env:
          PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
          PROD_HISTORY_DIR: ${{ vars.PROD_HISTORY_DIR }}
          PROD_PROJECT_DIR: ${{ vars.PROD_PROJECT_DIR }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          : "${PROD_DEPLOY_HOST:?Missing production variable PROD_DEPLOY_HOST}"
          : "${PROD_PROJECT_DIR:?Missing production variable PROD_PROJECT_DIR}"
          : "${PROD_HISTORY_DIR:?Missing production variable PROD_HISTORY_DIR}"
          : "${PROD_SSH_PRIVATE_KEY:?Missing production secret PROD_SSH_PRIVATE_KEY}"
          : "${PROD_SSH_KNOWN_HOSTS:?Missing production secret PROD_SSH_KNOWN_HOSTS}"
          [[ "$PROD_PROJECT_DIR" == /home/ubuntu/* && "$PROD_PROJECT_DIR" != /home/ubuntu/ ]] || exit 1
          [[ "$PROD_HISTORY_DIR" == /home/ubuntu/* && "$PROD_HISTORY_DIR" != /home/ubuntu/ ]] || exit 1
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/greatsell-production-promote"
          chmod 600 "$RUNNER_TEMP/greatsell-production-promote"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F "${PROD_DEPLOY_HOST#*@}" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Preflight production configuration before tagging
        env:
          PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
          PROD_HISTORY_DIR: ${{ vars.PROD_HISTORY_DIR }}
          PROD_PROJECT_DIR: ${{ vars.PROD_PROJECT_DIR }}
        run: |
          set -Eeuo pipefail
          scripts/preflight-production-release.sh "$RELEASE_SHA" \
            --host "$PROD_DEPLOY_HOST" \
            --project-dir "$PROD_PROJECT_DIR" \
            --history-dir "$PROD_HISTORY_DIR" \
            --ssh-key "$RUNNER_TEMP/greatsell-production-promote"
      - name: Download completed staging CI images
        uses: actions/download-artifact@v4
        with:
          name: release-images-${{ env.RELEASE_SHA }}-${{ env.CI_RUN_ID }}-${{ env.CI_RUN_ATTEMPT }}
          path: ${{ runner.temp }}/greatsell-release-images
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify and load completed staging CI images
        id: load_ci_images
        run: |
          set -Eeuo pipefail
          scripts/load-verified-release-images.sh "$RELEASE_SHA" \
            --artifact-dir "$RUNNER_TEMP/greatsell-release-images" \
            --repository "$GITHUB_REPOSITORY" \
            --ci-run-id "$CI_RUN_ID" \
            --ci-run-attempt "$CI_RUN_ATTEMPT" \
            --expected-ci-image-archive-sha256 "$STAGING_CI_IMAGE_ARCHIVE_SHA256" \
            --expected-api-image-config-digest "$STAGING_API_IMAGE_CONFIG_DIGEST" \
            --expected-caddy-image-config-digest "$STAGING_CADDY_IMAGE_CONFIG_DIGEST" \
            --github-output "$GITHUB_OUTPUT"
      - name: Transfer exact completed staging images to production
        env:
          PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
        run: |
          set -Eeuo pipefail
          scripts/transfer-production-images.sh "$RELEASE_SHA" \
            --host "$PROD_DEPLOY_HOST" \
            --archive "$RUNNER_TEMP/greatsell-release-images/release-images-$RELEASE_SHA-$CI_RUN_ID-$CI_RUN_ATTEMPT.tar.gz" \
            --archive-sha256 "${{ steps.load_ci_images.outputs.ci_image_archive_sha256 }}" \
            --expected-ci-run-id "$CI_RUN_ID" \
            --expected-ci-run-attempt "$CI_RUN_ATTEMPT" \
            --ssh-key "$RUNNER_TEMP/greatsell-production-promote"
      - name: Verify production host holds CI-attested images
        env:
          PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
        run: |
          set -Eeuo pipefail
          scripts/verify-release-images.sh "$RELEASE_SHA" \
            --host "$PROD_DEPLOY_HOST" \
            --expected-ci-run-id "$CI_RUN_ID" \
            --expected-ci-run-attempt "$CI_RUN_ATTEMPT" \
            --ssh-key "$RUNNER_TEMP/greatsell-production-promote"
      - name: Reconfirm promotion target before production tagging
        run: |
          set -Eeuo pipefail
          git fetch origin main --tags --prune
          git switch --force-create main origin/main
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || {
            echo "main advanced during production preparation. Stage the new main before promoting it." >&2
            exit 1
          }
      - name: Create immutable production tag for the staged candidate
        id: release
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t existing_tags < <(git tag --points-at HEAD --list 'prod-*' | sort)
          [[ "${#existing_tags[@]}" -le 1 ]] || {
            echo "Current main has multiple production tags; use Production deploy for an existing release." >&2
            exit 1
          }
          if [[ "${#existing_tags[@]}" -eq 1 ]]; then
            tag="${existing_tags[0]}"
            [[ "$tag" =~ ^prod-[0-9]{8}-[0-9a-f]{7,40}$ ]] || {
              echo "Existing production tag has an invalid format." >&2
              exit 1
            }
            echo "Reusing immutable production tag $tag."
          else
            tag="prod-$(date -u +%Y%m%d)-$(git rev-parse --short=7 HEAD)"
            scripts/create-production-tag.sh "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Deploy tagged release from the exact staged images
        env:
          PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
          PROD_HISTORY_DIR: ${{ vars.PROD_HISTORY_DIR }}
          PROD_PROJECT_DIR: ${{ vars.PROD_PROJECT_DIR }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          scripts/deploy-production.sh "$RELEASE_TAG" \
            --host "$PROD_DEPLOY_HOST" \
            --project-dir "$PROD_PROJECT_DIR" \
            --history-dir "$PROD_HISTORY_DIR" \
            --ssh-key "$RUNNER_TEMP/greatsell-production-promote" \
            --prebuilt-images
      - name: Remove temporary CI images from release runner
        if: always()
        run: |
          set -Eeuo pipefail
          docker image rm -f "greatsellai-hr-api:$RELEASE_SHA" || true
          docker image rm -f "greatsellai-hr-caddy:$RELEASE_SHA" || true
