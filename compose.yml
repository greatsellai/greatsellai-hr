name: resume-screening-v3

x-container-logging: &container-logging
  # Keep local diagnostics bounded. Application events are emitted as JSON to
  # stdout, so a collector such as Tencent CLS can consume them without a
  # second application-specific transport.
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app-environment: &app-environment
  RESUME_V3_ENVIRONMENT: production
  RESUME_V3_AUTO_CREATE_SCHEMA: "0"
  RESUME_V3_SEED_REGISTRY_ON_STARTUP: "0"
  RESUME_V3_DATABASE_URL: postgresql+psycopg://resume_v3:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@db:5432/resume_v3
  RESUME_V3_DATA_DIR: /var/lib/resume-v3
  RESUME_V3_SESSION_SECRET: ${RESUME_V3_SESSION_SECRET:?set RESUME_V3_SESSION_SECRET in .env.production}
  RESUME_V3_SESSION_COOKIE_SECURE: ${RESUME_V3_SESSION_COOKIE_SECURE:-1}
  # The API accepts Caddy's final X-Forwarded-For value only when the direct
  # peer is this fixed, private proxy address. Do not widen this to a public
  # range: an arbitrary caller must never be able to choose its rate-limit IP.
  RESUME_V3_TRUSTED_PROXY_CIDRS: ${RESUME_V3_TRUSTED_PROXY_CIDRS:?set RESUME_V3_TRUSTED_PROXY_CIDRS in .env.production}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
  DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-90}
  # Platform Provider records store only a credential reference. The actual
  # reference-to-secret map stays in the ignored deployment environment file
  # and must be identical for API and worker execution.
  RESUME_V3_AI_PROVIDER_CREDENTIALS_JSON: "${RESUME_V3_AI_PROVIDER_CREDENTIALS_JSON:-}"
  RESUME_V3_LEGACY_OPENAI_COMPATIBLE_ENDPOINT: "${RESUME_V3_LEGACY_OPENAI_COMPATIBLE_ENDPOINT:-https://api.deepseek.com/beta/chat/completions}"
  TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
  TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
  TENCENT_OCR_REGION: ${TENCENT_OCR_REGION:-ap-guangzhou}
  TENCENT_OCR_TIMEOUT_SECONDS: ${TENCENT_OCR_TIMEOUT_SECONDS:-20}
  # Preserve the historic Basic action unless the deployment explicitly
  # selects Tencent's higher-precision GeneralAccurateOCR endpoint.
  TENCENT_OCR_API: ${TENCENT_OCR_API:-GeneralBasicOCR}
  OCR_SPARSE_TEXT_CHARS_PER_PAGE: ${OCR_SPARSE_TEXT_CHARS_PER_PAGE:-200}
  RESUME_V3_AI_EXTRACTION_JOB_MAX_ATTEMPTS: ${RESUME_V3_AI_EXTRACTION_JOB_MAX_ATTEMPTS:-3}
  RESUME_V3_AI_EXTRACTION_JOB_LEASE_SECONDS: ${RESUME_V3_AI_EXTRACTION_JOB_LEASE_SECONDS:-180}
  RESUME_V3_AI_EXTRACTION_WORKER_POLL_SECONDS: ${RESUME_V3_AI_EXTRACTION_WORKER_POLL_SECONDS:-2}
  # One shared container may run several isolated child processes. Workspaces
  # still receive only one heavy-work lane at a time, so a large batch cannot
  # starve unrelated customers.
  RESUME_V3_WORKER_CONCURRENCY: ${RESUME_V3_WORKER_CONCURRENCY:-1}
  RESUME_V3_WORKER_DATABASE_POOL_SIZE: ${RESUME_V3_WORKER_DATABASE_POOL_SIZE:-2}
  RESUME_V3_WORKER_DATABASE_MAX_OVERFLOW: ${RESUME_V3_WORKER_DATABASE_MAX_OVERFLOW:-0}
  RESUME_V3_WORKER_WORKSPACE_LANE_LEASE_SECONDS: ${RESUME_V3_WORKER_WORKSPACE_LANE_LEASE_SECONDS:-210}
  RESUME_V3_MAILBOX_SYNC_INTERVAL_SECONDS: ${RESUME_V3_MAILBOX_SYNC_INTERVAL_SECONDS:-600}
  RESUME_V3_MAILBOX_RETENTION_CLEANUP_INTERVAL_SECONDS: ${RESUME_V3_MAILBOX_RETENTION_CLEANUP_INTERVAL_SECONDS:-3600}
  RESUME_V3_MAILBOX_SYNC_ATTACHMENT_LIMIT: ${RESUME_V3_MAILBOX_SYNC_ATTACHMENT_LIMIT:-20}
  # Keep every mailbox policy in the shared runtime anchor. API validates
  # browser OAuth callbacks and worker refreshes the resulting credentials;
  # differing limits would make one mailbox behave differently by process.
  RESUME_V3_MAILBOX_IMAP_ALLOWED_HOSTS: "${RESUME_V3_MAILBOX_IMAP_ALLOWED_HOSTS:-imap.feishu.cn,imap.exmail.qq.com,imap.qq.com,imap.gmail.com,outlook.office365.com}"
  RESUME_V3_MAILBOX_IMAP_CONNECT_TIMEOUT_SECONDS: ${RESUME_V3_MAILBOX_IMAP_CONNECT_TIMEOUT_SECONDS:-10}
  RESUME_V3_MAILBOX_IMAP_MAX_RESOLVED_ADDRESSES: ${RESUME_V3_MAILBOX_IMAP_MAX_RESOLVED_ADDRESSES:-8}
  RESUME_V3_MAILBOX_OAUTH_STATE_TTL_SECONDS: ${RESUME_V3_MAILBOX_OAUTH_STATE_TTL_SECONDS:-600}
  RESUME_V3_MAILBOX_OAUTH_HTTP_TIMEOUT_SECONDS: ${RESUME_V3_MAILBOX_OAUTH_HTTP_TIMEOUT_SECONDS:-20}
  RESUME_V3_MAILBOX_MAX_RAW_MESSAGE_BYTES: ${RESUME_V3_MAILBOX_MAX_RAW_MESSAGE_BYTES:-25165824}
  RESUME_V3_MAILBOX_MAX_HEADER_BYTES: ${RESUME_V3_MAILBOX_MAX_HEADER_BYTES:-131072}
  RESUME_V3_MAILBOX_MAX_MIME_PARTS: ${RESUME_V3_MAILBOX_MAX_MIME_PARTS:-64}
  RESUME_V3_MAILBOX_MAX_MIME_DEPTH: ${RESUME_V3_MAILBOX_MAX_MIME_DEPTH:-16}
  RESUME_V3_MAILBOX_MAX_ATTACHMENTS_PER_MESSAGE: ${RESUME_V3_MAILBOX_MAX_ATTACHMENTS_PER_MESSAGE:-5}
  RESUME_V3_MAILBOX_MAX_SEARCH_RESPONSE_BYTES: ${RESUME_V3_MAILBOX_MAX_SEARCH_RESPONSE_BYTES:-1048576}
  RESUME_V3_MAILBOX_MAX_BODY_CACHE_BYTES: ${RESUME_V3_MAILBOX_MAX_BODY_CACHE_BYTES:-262144}
  RESUME_V3_MAILBOX_CONSECUTIVE_FAILURE_ALERT_THRESHOLD: ${RESUME_V3_MAILBOX_CONSECUTIVE_FAILURE_ALERT_THRESHOLD:-3}
  RESUME_V3_MAILBOX_CONSECUTIVE_FAILURE_WINDOW_SECONDS: ${RESUME_V3_MAILBOX_CONSECUTIVE_FAILURE_WINDOW_SECONDS:-3600}
  RESUME_V3_EMAIL_CREDENTIALS_KEY: ${RESUME_V3_EMAIL_CREDENTIALS_KEY:-}
  # OAuth client metadata is deployment-owned. API performs browser code
  # exchange while the worker refreshes access tokens for scheduled IMAP syncs.
  RESUME_V3_MAILBOX_GOOGLE_OAUTH_CLIENT_ID: ${RESUME_V3_MAILBOX_GOOGLE_OAUTH_CLIENT_ID:-}
  RESUME_V3_MAILBOX_GOOGLE_OAUTH_CLIENT_SECRET: ${RESUME_V3_MAILBOX_GOOGLE_OAUTH_CLIENT_SECRET:-}
  RESUME_V3_MAILBOX_GOOGLE_OAUTH_REDIRECT_URI: ${RESUME_V3_MAILBOX_GOOGLE_OAUTH_REDIRECT_URI:-}
  RESUME_V3_MAILBOX_MICROSOFT_OAUTH_CLIENT_ID: ${RESUME_V3_MAILBOX_MICROSOFT_OAUTH_CLIENT_ID:-}
  RESUME_V3_MAILBOX_MICROSOFT_OAUTH_CLIENT_SECRET: ${RESUME_V3_MAILBOX_MICROSOFT_OAUTH_CLIENT_SECRET:-}
  RESUME_V3_MAILBOX_MICROSOFT_OAUTH_REDIRECT_URI: ${RESUME_V3_MAILBOX_MICROSOFT_OAUTH_REDIRECT_URI:-}
  # Transactional account email is isolated from mailbox-ingestion credentials.
  # Tencent SES template IDs are intentionally passed to API and worker through
  # this shared anchor: API sends verification mail, while worker sends durable
  # password-reset outbox jobs.
  RESUME_V3_TRANSACTIONAL_EMAIL_PROVIDER: ${RESUME_V3_TRANSACTIONAL_EMAIL_PROVIDER:-disabled}
  RESUME_V3_TRANSACTIONAL_EMAIL_FROM: ${RESUME_V3_TRANSACTIONAL_EMAIL_FROM:-}
  RESUME_V3_PUBLIC_APP_URL: ${RESUME_V3_PUBLIC_APP_URL:-}
  TENCENT_SES_REGION: ${TENCENT_SES_REGION:-ap-guangzhou}
  TENCENT_SES_VERIFICATION_TEMPLATE_ID: ${TENCENT_SES_VERIFICATION_TEMPLATE_ID:-}
  TENCENT_SES_PASSWORD_RESET_TEMPLATE_ID: ${TENCENT_SES_PASSWORD_RESET_TEMPLATE_ID:-}
  RESUME_V3_FEISHU_SMTP_HOST: ${RESUME_V3_FEISHU_SMTP_HOST:-smtp.feishu.cn}
  RESUME_V3_FEISHU_SMTP_PORT: ${RESUME_V3_FEISHU_SMTP_PORT:-465}
  RESUME_V3_FEISHU_SMTP_TLS_MODE: ${RESUME_V3_FEISHU_SMTP_TLS_MODE:-ssl}
  RESUME_V3_FEISHU_SMTP_USERNAME: ${RESUME_V3_FEISHU_SMTP_USERNAME:-}
  RESUME_V3_FEISHU_SMTP_PASSWORD: ${RESUME_V3_FEISHU_SMTP_PASSWORD:-}
  RESUME_V3_FEISHU_SMTP_TIMEOUT_SECONDS: ${RESUME_V3_FEISHU_SMTP_TIMEOUT_SECONDS:-20}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: resume_v3
      POSTGRES_USER: resume_v3
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    logging: *container-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_v3 -d resume_v3"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    image: greatsellai-hr-api:${RESUME_V3_RELEASE_IMAGE_TAG:-local}
    restart: "no"
    environment:
      <<: *app-environment
      # A one-time, explicit named-account handoff for historical static-auth
      # data. This never reaches API or worker containers and is ignored when
      # the database is pristine or already has a formal platform admin.
      RESUME_V3_LEGACY_WORKSPACE_ADOPTION_USER_ID: ${RESUME_V3_LEGACY_WORKSPACE_ADOPTION_USER_ID:-}
    command: ["/bin/sh", "-c", "alembic upgrade head && python -m app.seed_institutions"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    logging: *container-logging

  api:
    build: .
    image: greatsellai-hr-api:${RESUME_V3_RELEASE_IMAGE_TAG:-local}
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - uploads_data:/var/lib/resume-v3/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      # The API must never receive Caddy's reserved .2 address while Caddy is
      # temporarily absent during a release. Keeping both endpoints static
      # makes the precise trusted-proxy /32 deterministic.
      proxy:
        ipv4_address: 172.30.0.3
      backend: {}
    logging: *container-logging
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health').status == 200",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    image: greatsellai-hr-api:${RESUME_V3_RELEASE_IMAGE_TAG:-local}
    restart: unless-stopped
    environment: *app-environment
    command: ["python", "-m", "app.ai_extraction_worker"]
    # Mailbox attachments are ingested by the worker, while original-file
    # previews are served by the API. Both services therefore must see the
    # same durable upload directory.
    volumes:
      - uploads_data:/var/lib/resume-v3/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    logging: *container-logging

  caddy:
    build:
      context: .
      dockerfile: deploy/Caddy.Dockerfile
    image: greatsellai-hr-caddy:${RESUME_V3_RELEASE_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      RESUME_V3_DOMAIN: ${RESUME_V3_DOMAIN:?set RESUME_V3_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      proxy:
        ipv4_address: 172.30.0.2
    logging: *container-logging

networks:
  # Only Caddy and the API are connected here. Caddy has a stable address so
  # the application can trust a precise /32 rather than every service on the
  # database network.
  proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend: {}

volumes:
  postgres_data:
  uploads_data:
    # Keep the historical Compose-generated name explicit. The release helper
    # uses this stable name to back up exactly the originals API/worker share.
    name: resume-screening-v3_uploads_data
  caddy_data:
  caddy_config:
