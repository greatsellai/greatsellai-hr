[project]
name = "resume-screening-v3"
version = "0.1.0"
description = "Clean-room resume ingestion and condition-filtering foundation."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "beautifulsoup4>=4.12,<5",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "pydantic>=2.9,<3",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "PyMuPDF>=1.24,<2",
  "pypdf>=5,<7",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0,<3",
  "tencentcloud-sdk-python>=3.1,<4",
  # Guarantees IANA timezone data in the slim production image as well as
  # local SQLite tests; ``zoneinfo`` otherwise depends on OS packages.
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["resources/*.json", "resources/*.md"]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
resume-v3-seed-institutions = "app.seed_institutions:main"
resume-v3-ai-extraction-worker = "app.ai_extraction_worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
