name: Text encoding integrity

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: UTF-8 source and PR metadata
    runs-on: [self-hosted, Linux, X64, greatsell-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate text encoding integrity
        run: python scripts/check_text_encoding.py --github-event "$GITHUB_EVENT_PATH"
