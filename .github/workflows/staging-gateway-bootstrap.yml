name: Staging gateway bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ENABLE_STAGING_GATEWAY to make the reviewed exact staging route available on the production edge.
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    name: Enable the reviewed staging edge route
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "Linux", "X64", "greatsell-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    # This is an explicit production infrastructure change, never an implicit
    # side effect of a staging deployment. Production Environment reviewers
    # must approve it before the public edge is changed.
    concurrency:
      group: greatsellai-hr-release-lane
      cancel-in-progress: false
    environment:
      name: production
    steps:
      - name: Validate bootstrap request
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Staging gateway bootstrap must be started from main." >&2
            exit 1
          }
          [[ "$CONFIRM" == "ENABLE_STAGING_GATEWAY" ]] || {
            echo "Confirmation must be ENABLE_STAGING_GATEWAY." >&2
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
      - name: Configure production SSH
        env:
          PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          : "${PROD_DEPLOY_HOST:?Missing production variable PROD_DEPLOY_HOST}"
          : "${PROD_SSH_PRIVATE_KEY:?Missing production secret PROD_SSH_PRIVATE_KEY}"
          : "${PROD_SSH_KNOWN_HOSTS:?Missing production secret PROD_SSH_KNOWN_HOSTS}"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/greatsell-production-bootstrap"
          chmod 600 "$RUNNER_TEMP/greatsell-production-bootstrap"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F "${PROD_DEPLOY_HOST#*@}" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "Production known_hosts does not contain the configured host." >&2
            exit 1
          }
      - name: Enable only the exact staging gateway route
        env:
          PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
        run: |
          set -Eeuo pipefail
          scripts/ensure-staging-gateway.sh \
            --host "$PROD_DEPLOY_HOST" \
            --ssh-key "$RUNNER_TEMP/greatsell-production-bootstrap"
