<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>验证你的 GreatSell AI 工作邮箱</title>
  </head>
  <body style="margin:0;background:#f5f5f4;color:#18181b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.7;">
    <main style="max-width:600px;margin:0 auto;padding:32px 24px;background:#ffffff;">
      <h1 style="margin:0 0 20px;font-size:22px;line-height:1.35;">验证你的工作邮箱</h1>
      <p>您好：</p>
      <p>感谢注册 GreatSell AI 招聘工具。请点击下方按钮验证您的工作邮箱，完成账号开通后即可开始使用招聘工具。</p>
      <p style="margin:28px 0;">
        <a href="https://hr.greatsell.cn/verify-email?token={{token}}" style="display:inline-block;padding:11px 18px;background:#e11d2e;color:#ffffff;text-decoration:none;border-radius:6px;">验证工作邮箱</a>
      </p>
      <p>此链接将在 {{expires_minutes}} 分钟后失效，且仅可使用一次。如非本人注册，请忽略本邮件。</p>
      <p style="margin-top:28px;color:#71717a;">GreatSell AI 招聘工具</p>
    </main>
  </body>
</html>
