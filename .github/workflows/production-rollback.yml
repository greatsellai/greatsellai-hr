name: Production rollback

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Previously deployed prod-YYYYMMDD-<commit-sha> tag to roll back to.
        required: true
        type: string
      allow_schema_ahead:
        description: Keep the current database schema when the rollback crosses migrations.
        required: true
        default: false
        type: boolean
      confirm:
        description: Type ROLLBACK to confirm this production rollback.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: greatsellai-hr-production
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back production tag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate rollback request
        env:
          ALLOW_SCHEMA_AHEAD: ${{ inputs.allow_schema_ahead }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Manual production rollbacks must be started from main." >&2; exit 1; }
          [[ "$CONFIRM" == "ROLLBACK" ]] || { echo "Confirmation must be ROLLBACK." >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^prod-[0-9]{8}-[0-9a-f]{7,40}$ ]] || { echo "Invalid production tag." >&2; exit 1; }
          [[ "$ALLOW_SCHEMA_AHEAD" == "true" || "$ALLOW_SCHEMA_AHEAD" == "false" ]] || { echo "Invalid allow_schema_ahead value." >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Verify production tag identity
        run: |
          set -Eeuo pipefail
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          expected_short_sha="${RELEASE_TAG##*-}"
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$expected_short_sha"* ]] || {
            echo "Production tag suffix does not match its target commit." >&2
            exit 1
          }
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" origin/main || {
            echo "Production tag is not reachable from origin/main." >&2
            exit 1
          }
      - name: Configure production SSH
        env:
          PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          : "${PROD_DEPLOY_HOST:?Missing production variable PROD_DEPLOY_HOST}"
          : "${PROD_SSH_PRIVATE_KEY:?Missing production secret PROD_SSH_PRIVATE_KEY}"
          : "${PROD_SSH_KNOWN_HOSTS:?Missing production secret PROD_SSH_KNOWN_HOSTS}"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/greatsell-production-deploy"
          chmod 600 "$RUNNER_TEMP/greatsell-production-deploy"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F "${PROD_DEPLOY_HOST#*@}" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "Production known_hosts does not contain the configured host." >&2
            exit 1
          }
      - name: Roll back to existing tag
        env:
          ALLOW_SCHEMA_AHEAD: ${{ inputs.allow_schema_ahead }}
          PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
          PROD_HISTORY_DIR: ${{ vars.PROD_HISTORY_DIR }}
          PROD_PROJECT_DIR: ${{ vars.PROD_PROJECT_DIR }}
        run: |
          set -Eeuo pipefail
          : "${PROD_DEPLOY_HOST:?Missing production variable PROD_DEPLOY_HOST}"
          : "${PROD_PROJECT_DIR:?Missing production variable PROD_PROJECT_DIR}"
          : "${PROD_HISTORY_DIR:?Missing production variable PROD_HISTORY_DIR}"
          rollback_args=()
          if [[ "$ALLOW_SCHEMA_AHEAD" == "true" ]]; then
            rollback_args+=(--allow-schema-ahead)
          fi
          scripts/rollback-production.sh "$RELEASE_TAG" \
            --host "$PROD_DEPLOY_HOST" \
            --project-dir "$PROD_PROJECT_DIR" \
            --history-dir "$PROD_HISTORY_DIR" \
            --ssh-key "$RUNNER_TEMP/greatsell-production-deploy" \
            "${rollback_args[@]}"
