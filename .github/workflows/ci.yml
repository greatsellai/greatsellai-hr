name: Continuous integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main-release-provenance:
    name: Main release provenance
    # Private GitHub Free repositories cannot rely on branch protection.  This
    # fails closed for an accidental direct push before any image build or
    # staging-release workflow can transfer these exact images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "Linux", "X64", "greatsell-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify merged pull request provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_main_release_provenance.py

  backend:
    name: Backend tests
    # Full application verification is the pull-request gate.  A main push is
    # proven by that PR run below, then only performs the release preflight
    # needed to create exact-SHA production images.
    if: github.event_name != 'push'
    # A public fork PR must never execute on the trusted local Docker runner.
    # Private repositories keep the existing self-hosted path without a manual
    # workflow edit when the repository visibility changes back.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "Linux", "X64", "greatsell-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-production.lock
      - name: Install backend dependencies
        run: python -m pip install -c requirements-production.lock -e ".[dev]"
      - name: Compile backend modules
        run: python -m compileall -q app
      - name: Run backend test suite
        run: python -m pytest -q

  postgres-mailbox-race:
    # Keep this stable: main-release provenance validates the completed PR
    # check by its public job name before it allows a deployment.
    name: PostgreSQL mailbox race
    if: github.event_name != 'push'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "Linux", "X64", "greatsell-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resume_v3_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d resume_v3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MAILBOX_DEDUP_POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/resume_v3_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-production.lock
      - name: Install backend dependencies
        run: python -m pip install -c requirements-production.lock -e ".[dev]"
      - name: Run PostgreSQL concurrency regressions
        run: python -m pytest -q tests/test_mailbox_content_claim_postgres.py tests/test_workspace_background_lane_postgres.py

  web:
    name: Web build
    if: github.event_name != 'push'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "Linux", "X64", "greatsell-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-production.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install backend dependencies for isolated browser tests
        run: python -m pip install -c requirements-production.lock -e ".[dev]"
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Install Chromium for Playwright critical paths
        working-directory: web
        # The trusted self-hosted runner is provisioned once. Standard GitHub
        # hosted Ubuntu runners are ephemeral, so install their browser system
        # dependencies with Chromium instead.
        run: |
          if [[ "${RUNNER_ENVIRONMENT:-self-hosted}" == "github-hosted" ]]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      - name: Run Playwright critical paths
        working-directory: web
        shell: bash
        run: |
          # A self-hosted runner can retain a failed Playwright web server.
          # Give each workflow attempt isolated loopback ports and test data
          # instead of colliding with the local defaults (8012/5176).
          port_offset=$(( (GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT) % 5000 ))
          export E2E_API_PORT=$(( 20000 + port_offset ))
          export E2E_WEB_PORT=$(( 26000 + port_offset ))
          export E2E_DATA_DIR="$GITHUB_WORKSPACE/data/e2e-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'rm -rf -- "$E2E_DATA_DIR"' EXIT
          echo "Running isolated Playwright servers on $E2E_API_PORT and $E2E_WEB_PORT."
          npm run e2e

  production-images:
    name: Production image builds
    # Exact-SHA release images are pushed to TCR and accompanied by a small
    # digest metadata artifact. Building them for a PR or a manual CI run can
    # create different provenance, so release images originate only from a
    # verified merged main push in both public and private repository modes.
    needs: [main-release-provenance]
    if: >-
      always() &&
      needs.main-release-provenance.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    # This job accepts neither pull-request nor manual workflow input and only
    # runs after verified merged-main provenance. Keep the large image build
    # on the trusted domestic runner so the first push of large production
    # layers does not depend on a slow cross-border hosted-runner transfer.
    runs-on: [self-hosted, Linux, X64, greatsell-ci]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build application production image
        shell: bash
        run: |
          # Base-image, apt, and package-index fetches are external network
          # operations. Retry once so a transient hosted-runner failure does
          # not block a healthy production release.
          for attempt in 1 2; do
            if docker build --build-arg DEBIAN_MIRROR=mirrors.cloud.tencent.com \
              --build-arg PIP_INDEX_URL=https://mirrors.cloud.tencent.com/pypi/simple \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --label "org.opencontainers.image.workflow_run_id=${{ github.run_id }}" \
              --label "org.opencontainers.image.workflow_run_attempt=${{ github.run_attempt }}" \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --tag "greatsellai-hr-api:${{ github.sha }}" .; then
              exit 0
            fi

            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi

            echo "Application image build failed; retrying once in 15 seconds."
            sleep 15
          done
      - name: Build Caddy production image
        shell: bash
        run: |
          # The Caddy image rebuilds the SPA and can occasionally hit a
          # transient registry/network failure on hosted runners. Retrying
          # once keeps a healthy commit from blocking the production release.
          for attempt in 1 2; do
            if docker build --build-arg NPM_REGISTRY=https://mirrors.cloud.tencent.com/npm/ \
              --file deploy/Caddy.Dockerfile \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --label "org.opencontainers.image.workflow_run_id=${{ github.run_id }}" \
              --label "org.opencontainers.image.workflow_run_attempt=${{ github.run_attempt }}" \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --tag "greatsellai-hr-caddy:${{ github.sha }}" .; then
              exit 0
            fi

            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi

            echo "Caddy image build failed; retrying once in 15 seconds."
            sleep 15
          done
      - name: Validate production Compose model
        run: |
          docker compose --env-file .env.production.example config --quiet
          python scripts/verify_production_compose.py
      - name: Run Docker release runtime regression
        id: release_runtime_regression
        # The main image is rebuilt after PR validation.  Exercise the full
        # release harness against this exact deployable artifact rather than
        # assuming a previous PR image had identical base layers.
        run: >-
          python scripts/run_release_regression.py --all
          --image "greatsellai-hr-api:${{ github.sha }}"
      - name: Publish immutable CI images to TCR
        env:
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
        run: |
          set -Eeuo pipefail
          : "${TCR_REGISTRY:?Missing repository variable TCR_REGISTRY}"
          : "${TCR_USERNAME:?Missing repository secret TCR_USERNAME}"
          : "${TCR_PASSWORD:?Missing repository secret TCR_PASSWORD}"
          : "${TCR_NAMESPACE:?Missing repository variable TCR_NAMESPACE}"
          : "${RUNNER_TEMP:?Missing GitHub Actions temporary directory}"
          docker_config="$(mktemp -d "$RUNNER_TEMP/greatsell-tcr.XXXXXXXX")"
          [[ "$docker_config" == "$RUNNER_TEMP"/greatsell-tcr.* ]] || {
            echo "Refusing unexpected temporary Docker credential directory." >&2
            exit 1
          }
          chmod 700 "$docker_config"
          trap 'rm -rf -- "$docker_config"' EXIT
          printf '%s\n' "$TCR_PASSWORD" | scripts/write-docker-registry-auth.sh \
            --registry "$TCR_REGISTRY" \
            --username "$TCR_USERNAME" \
            --docker-config "$docker_config" \
            --password-stdin
          unset TCR_PASSWORD
          DOCKER_CONFIG="$docker_config" scripts/publish-tcr-release-images.sh "$GITHUB_SHA" \
            --registry "$TCR_REGISTRY" \
            --namespace "$TCR_NAMESPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --artifact-dir "$RUNNER_TEMP/greatsell-release-image-metadata"
      - name: Upload CI-verified TCR metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-image-metadata-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/greatsell-release-image-metadata/
          if-no-files-found: error
          # Keep the immutable digest handoff through the approval window. If
          # it expires, the commit must be re-staged instead of rebuilt on a
          # deployment host.
          retention-days: 30
      - name: Remove temporary release regression resources
        if: always()
        env:
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
        run: |
          filter='label=com.greatsell.release-regression=true'
          docker ps -aq --filter "$filter" | xargs -r docker rm -f || true
          docker network ls -q --filter "$filter" | xargs -r docker network rm || true
          docker volume ls -q --filter "$filter" | xargs -r docker volume rm || true
          docker image ls -q --filter "$filter" | sort -u | xargs -r docker image rm || true
          docker image rm -f "greatsellai-hr-api:${{ github.sha }}" || true
          docker image rm -f "greatsellai-hr-caddy:${{ github.sha }}" || true
          if [[ -n "${TCR_REGISTRY:-}" ]]; then
            docker logout "$TCR_REGISTRY" || true
          fi
