name: Continuous integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile backend modules
        run: python -m compileall -q app
      - name: Run backend test suite
        run: python -m pytest -q

  postgres-mailbox-race:
    name: PostgreSQL mailbox race
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resume_v3_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d resume_v3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MAILBOX_DEDUP_POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/resume_v3_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run PostgreSQL mailbox concurrency regression
        run: python -m pytest -q tests/test_mailbox_content_claim_postgres.py

  web:
    name: Web build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build

  production-images:
    name: Production image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build application production image
        run: >-
          docker build --build-arg DEBIAN_MIRROR=deb.debian.org
          --build-arg PIP_INDEX_URL=https://pypi.org/simple
          --tag "greatsellai-hr-ci:${{ github.sha }}" .
      - name: Build Caddy production image
        run: >-
          docker build --build-arg NPM_REGISTRY=https://registry.npmjs.org/
          --file deploy/Caddy.Dockerfile
          --tag "greatsellai-hr-caddy-ci:${{ github.sha }}" .
      - name: Validate production Compose model
        run: docker compose --env-file .env.production.example config --quiet
