name: Production legacy pending reconciliation

on:
  workflow_dispatch:
    inputs:
      pending_tag:
        description: Exact interrupted prod-YYYYMMDD-<commit-sha> tag recorded on production.
        required: true
        type: string
      pending_commit:
        description: Exact 40-character commit recorded in pending-release.env.
        required: true
        type: string
      confirm:
        description: Type RECONCILE_LEGACY_PENDING to take a paired backup and archive the legacy pending marker.
        required: true
        type: string

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile legacy pending release
    runs-on: [self-hosted, Linux, X64, greatsell-ci]
    timeout-minutes: 45
    concurrency:
      group: greatsellai-hr-release-lane
      cancel-in-progress: false
    environment:
      name: production
    env:
      PENDING_TAG: ${{ inputs.pending_tag }}
      PENDING_COMMIT: ${{ inputs.pending_commit }}
    steps:
      - name: Validate reconciliation request
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Legacy reconciliation must be started from main." >&2; exit 1; }
          [[ "$CONFIRM" == "RECONCILE_LEGACY_PENDING" ]] || { echo "Confirmation must be RECONCILE_LEGACY_PENDING." >&2; exit 1; }
          [[ "$PENDING_TAG" =~ ^prod-[0-9]{8}-[0-9a-f]{7,40}$ ]] || { echo "Invalid pending production tag." >&2; exit 1; }
          [[ "$PENDING_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid pending production commit." >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Verify pending tag identity
        run: |
          set -Eeuo pipefail
          git fetch origin "refs/tags/$PENDING_TAG:refs/tags/$PENDING_TAG"
          [[ "$(git rev-parse "refs/tags/$PENDING_TAG^{commit}")" == "$PENDING_COMMIT" ]] || {
            echo "Pending tag does not resolve to the requested commit." >&2
            exit 1
          }
          git merge-base --is-ancestor "$PENDING_COMMIT" origin/main || {
            echo "Pending production tag is not reachable from origin/main." >&2
            exit 1
          }
      - name: Configure production SSH
        id: production_ssh
        env:
          PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          : "${PROD_DEPLOY_HOST:?Missing production variable PROD_DEPLOY_HOST}"
          : "${PROD_SSH_PRIVATE_KEY:?Missing production secret PROD_SSH_PRIVATE_KEY}"
          : "${PROD_SSH_KNOWN_HOSTS:?Missing production secret PROD_SSH_KNOWN_HOSTS}"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/greatsell-production-deploy"
          chmod 600 "$RUNNER_TEMP/greatsell-production-deploy"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F "${PROD_DEPLOY_HOST#*@}" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "Production known_hosts does not contain the configured host." >&2
            exit 1
          }
      - name: Snapshot and archive the legacy pending marker
        env:
          PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
          PROD_HISTORY_DIR: ${{ vars.PROD_HISTORY_DIR }}
          PROD_PROJECT_DIR: ${{ vars.PROD_PROJECT_DIR }}
        run: |
          set -Eeuo pipefail
          : "${PROD_DEPLOY_HOST:?Missing production variable PROD_DEPLOY_HOST}"
          : "${PROD_PROJECT_DIR:?Missing production variable PROD_PROJECT_DIR}"
          : "${PROD_HISTORY_DIR:?Missing production variable PROD_HISTORY_DIR}"
          scripts/reconcile-legacy-pending-release.sh "$PENDING_TAG" "$PENDING_COMMIT" \
            --host "$PROD_DEPLOY_HOST" \
            --project-dir "$PROD_PROJECT_DIR" \
            --history-dir "$PROD_HISTORY_DIR" \
            --ssh-key "$RUNNER_TEMP/greatsell-production-deploy" \
            --confirm
      - name: Preserve the staging gateway after recovery
        if: ${{ always() && steps.production_ssh.outcome == 'success' }}
        env:
          PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
        run: |
          set -Eeuo pipefail
          scripts/ensure-staging-gateway.sh \
            --host "$PROD_DEPLOY_HOST" \
            --ssh-key "$RUNNER_TEMP/greatsell-production-deploy"
